name: Deploy Flask App to AWS CodeDeploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Zip application
        run: |
          rm -rf codedeploy.zip
          zip -r app.zip . -x ".git/*" ".github/*" "app.zip"

      - name: Upload to S3
        run: |
          aws s3 cp app.zip s3://amzn-s3-code-deploy/app.zip

      - name: Trigger CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name cmtr-740mo2tq-app \
            --deployment-group-name cmtr-740mo2tq-dg \
            --s3-location bucket=amzn-s3-code-deploy,key=app.zip,bundleType=zip
